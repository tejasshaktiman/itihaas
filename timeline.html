<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ITIHAS — Interactive Empire Timeline & Narrative Hub</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-dark: #070a12;
      --panel-dark: #0d1424;
      --card-inner: #131d33;
      --border-subtle: #1e293b;
      --amber-500: #f59e0b;
      --amber-600: #d97706;
      --amber-glow: rgba(245, 158, 11, 0.3);
      --sky-400: #38bdf8;
      --text-white: #ffffff;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-stack);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(217, 119, 6, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(56, 189, 248, 0.06) 0%, transparent 45%);
    }

    header {
      width: 100%;
      height: 58px;
      background: rgba(10, 15, 26, 0.9);
      border-bottom: 1px solid var(--border-subtle);
      backdrop-filter: blur(10px);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 50;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }

    .brand-badge {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--amber-500), var(--amber-600));
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      box-shadow: 0 2px 10px var(--amber-glow);
    }

    .brand-text {
      font-size: 16px;
      font-weight: 800;
    }

    .brand-text span {
      color: var(--amber-500);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      margin-left: 5px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-btn {
      background: #0f172a;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 6px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background: #1e293b;
      color: var(--text-white);
    }

    .workspace-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 20px 24px;
      overflow: hidden;
    }

    /* LEFT STORY BOX */
    .left-story-panel {
      background: var(--panel-dark);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    .stream-meta-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 16px;
    }

    .stream-badge-pill {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
      padding: 3px 10px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .stream-badge-pill::before {
      content: "";
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
    }

    .story-content-body {
      flex: 1;
      overflow-y: auto;
      padding-right: 6px;
    }

    .story-event-title {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.25;
      color: var(--text-white);
      margin-bottom: 6px;
    }

    .story-event-year {
      font-size: 12px;
      font-weight: 700;
      color: var(--amber-500);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 14px;
      display: block;
    }

    .stream-text-terminal {
      font-size: 13.5px;
      line-height: 1.7;
      color: #cbd5e1;
      white-space: pre-wrap;
    }

    .terminal-cursor {
      display: inline-block;
      width: 2px;
      height: 15px;
      background: var(--amber-500);
      margin-left: 3px;
      vertical-align: middle;
      animation: blink 0.75s infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .story-footer-interactive {
      margin-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 14px;
    }

    .interactive-label {
      font-size: 10.5px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--sky-400);
      margin-bottom: 8px;
      display: block;
    }

    .context-pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .context-pill {
      background: #090e1a;
      border: 1px solid var(--border-subtle);
      color: #94a3b8;
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .context-pill:hover {
      background: #1e293b;
      color: #f1f5f9;
      border-color: var(--sky-400);
    }

    /* RIGHT TIMELINE */
    .right-timeline-panel {
      background: var(--panel-dark);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .timeline-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 10px;
    }

    .timeline-panel-header h2 {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-white);
    }

    .timeline-panel-header span {
      font-size: 11px;
      color: var(--text-dim);
    }

    .timeline-track-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 10px 18px 70px 10px;
      position: relative;
    }

    .timeline-vertical-ruler {
      position: absolute;
      left: 110px;
      top: 0;
      bottom: 60px;
      width: 2px;
      background: linear-gradient(180deg, var(--amber-500) 0%, #334155 70%, transparent 100%);
    }

    .milestone-item {
      position: relative;
      display: flex;
      align-items: flex-start;
      margin-bottom: 28px;
      cursor: pointer;
    }

    .milestone-year-anchor {
      width: 90px;
      text-align: right;
      font-family: monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--amber-500);
      padding-right: 18px;
      padding-top: 3px;
    }

    .milestone-bullet-node {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #0f172a;
      border: 2px solid #64748b;
      position: absolute;
      left: 104px;
      top: 3px;
      z-index: 2;
      transition: all 0.25s ease;
    }

    .milestone-item:hover .milestone-bullet-node {
      background: var(--amber-500);
      border-color: #ffffff;
      transform: scale(1.35);
      box-shadow: 0 0 10px var(--amber-glow);
    }

    .milestone-item.active .milestone-bullet-node {
      background: var(--amber-500);
      border-color: #ffffff;
      box-shadow: 0 0 12px var(--amber-500);
    }

    .milestone-preview-card {
      margin-left: 36px;
      flex: 1;
      background: var(--card-inner);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 14px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .milestone-item:hover .milestone-preview-card {
      transform: translateX(4px);
      border-color: var(--amber-500);
      background: #1a2642;
    }

    .milestone-item.active .milestone-preview-card {
      border-color: var(--amber-500);
      border-left: 3px solid var(--amber-500);
    }

    .milestone-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-white);
      margin-bottom: 3px;
    }

    .milestone-brief {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .milestone-drawer-details {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.35s ease, opacity 0.25s ease, margin-top 0.25s ease;
      font-size: 11px;
      color: #93c5fd;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
    }

    .milestone-item:hover .milestone-drawer-details {
      max-height: 80px;
      opacity: 1;
      margin-top: 8px;
      padding-top: 6px;
    }

    .milestone-drawer-details ul {
      padding-left: 14px;
      margin: 0;
    }

    /* CENTERED BOTTOM ROLEPLAY BUTTON */
    .roleplay-action-dock {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
    }

    .btn-start-roleplay {
      background: linear-gradient(135deg, #d97706, #92400e);
      color: #ffffff;
      border: 1px solid rgba(251, 191, 36, 0.5);
      border-radius: 28px;
      padding: 10px 24px;
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(217, 119, 6, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-start-roleplay:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 6px 24px rgba(245, 158, 11, 0.6);
      background: linear-gradient(135deg, #f59e0b, #b45309);
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand-group">
      <div class="brand-badge">इ</div>
      <div class="brand-text">ITIHAS<span>Chronicle Hub</span></div>

  <div class="workspace-container">
    
    <!-- LEFT PANEL: Typewriter story box -->
    <div class="left-story-panel">
      <div>
        <div class="stream-meta-header">
          <span class="stream-badge-pill">PRE-CACHED STREAM READY</span>
          <span class="latency-indicator" id="display-topic-name">Topic</span>
        </div>

        <div class="story-content-body">
          <div class="story-event-year" id="display-event-year">Year</div>
          <h1 class="story-event-title" id="display-event-title">Milestone Title</h1>
          <div class="stream-text-terminal" id="typewriter-stream"></div>
        </div>
      </div>

      <div class="story-footer-interactive">
        <span class="interactive-label">Contextual Inquiries (Ask History)</span>
        <div class="context-pill-group">
          <button class="context-pill" onclick="promptFollowUp('Why did this happen?')">💬 Why did this happen?</button>

          <button class="context-pill" onclick="promptFollowUp('Long-term Consequences')">💬 Long-term Consequences</button>
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL: Chronological Timeline -->
    <div class="right-timeline-panel">
      <div class="timeline-panel-header">
        <h2 id="timeline-header-title">Timeline</h2>
        <span>Hover for details • Click to stream story</span>
      </div>

      <div class="timeline-track-viewport">
        <div class="timeline-vertical-ruler"></div>
        <div id="milestones-container"></div>
      </div>

      <!-- Centered Roleplay Launch Button -->
      <div class="roleplay-action-dock">
        <button class="btn-start-roleplay" onclick="launchRoleplayModal()">
          ⚡ START HISTORICAL ROLEPLAY
        </button>
      </div>
    </div>

  </div>

    let activeTopicKey = "mughal-empire";
    let activeEventId = "";
    let typewriterTimer = null;

    function getTopicFromURL() {
      const urlParams = new URLSearchParams(window.location.search);
      const topicParam = urlParams.get("topic");
      if (topicParam && TOPIC_DATABASE[topicParam]) {
        return topicParam;
      }
      return "mughal-empire";
    }

    function typeTextSmooth(element, text, speed = 12) {
      if (typewriterTimer) clearInterval(typewriterTimer);
      element.textContent = "";
      let index = 0;

      const cursor = document.createElement("span");
      cursor.className = "terminal-cursor";
      element.appendChild(cursor);

      typewriterTimer = setInterval(() => {
        if (index < text.length) {
          cursor.insertAdjacentText("beforebegin", text.charAt(index));
          index++;
        } else {
          clearInterval(typewriterTimer);
          typewriterTimer = null;
        }
      }, speed);
    }

    function selectMilestone(id) {
      activeEventId = id;
      const topicData = TOPIC_DATABASE[activeTopicKey];
      const target = topicData.events.find(item => item.id === id);
      if (!target) return;

      document.getElementById("display-event-year").textContent = target.year;
      document.getElementById("display-event-title").textContent = target.title;

      const streamContainer = document.getElementById("typewriter-stream");
      typeTextSmooth(streamContainer, target.fullStory, 12);

      const items = document.querySelectorAll(".milestone-item");
      items.forEach(el => {
        el.classList.toggle("active", el.dataset.id === id);
      });
    }

    function loadTopicTimeline(topicKey) {
      activeTopicKey = topicKey;
      const topicData = TOPIC_DATABASE[topicKey] || TOPIC_DATABASE["mughal-empire"];

      document.getElementById("timeline-header-title").textContent = topicData.title;
      document.getElementById("display-topic-name").textContent = topicData.title.split("(")[0].trim();

      const container = document.getElementById("milestones-container");
      container.innerHTML = "";

      topicData.events.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = `milestone-item ${index === 0 ? "active" : ""}`;
        row.dataset.id = item.id;
        row.onclick = () => selectMilestone(item.id);

        row.innerHTML = `
          <div class="milestone-year-anchor">${item.year}</div>
          <div class="milestone-bullet-node"></div>
          <div class="milestone-preview-card">
            <div class="milestone-name">${item.title}</div>
            <div class="milestone-brief">${item.brief}</div>
            <div class="milestone-drawer-details">
              <ul>
                ${item.details.map(d => `<li>${d}</li>`).join("")}
              </ul>
            </div>
          </div>
        `;

        container.appendChild(row);
      });

      if (topicData.events.length > 0) {
        selectMilestone(topicData.events[0].id);
      }
    }

    function launchRoleplayModal() {
      const topicData = TOPIC_DATABASE[activeTopicKey];
      const current = topicData.events.find(item => item.id === activeEventId);
      alert(
        `⚡ LAUNCHING HISTORICAL ROLEPLAY ⚡\n\n` +
        `Setting: ${topicData.title}\n` +
        `Milestone: ${current.year} — ${current.title}\n\n` +
        `Context: You are commanding key choices in this historical moment!`
      );
    }

    function promptFollowUp(questionType) {
      const streamContainer = document.getElementById("typewriter-stream");
      const topicData = TOPIC_DATABASE[activeTopicKey];
      const current = topicData.events.find(item => item.id === activeEventId);

      const followUpText = `\n\n[CURATED AI CONTEXT — ${questionType.toUpperCase()}]:\n` +
        `Regarding ${current.title} in ${current.year}: Primary historical records show this development had lasting political, administrative, and economic impacts on the region.`;
      
      typeTextSmooth(streamContainer, streamContainer.textContent + followUpText, 10);
    }

    window.addEventListener("DOMContentLoaded", () => {
      const detectedTopic = getTopicFromURL();
      loadTopicTimeline(detectedTopic);
    });
  </script>
