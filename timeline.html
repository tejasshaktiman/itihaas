<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ITIHAS — Interactive Empire Timeline & Narrative Hub</title>
  <style>
    /* =========================================================
       1. SYSTEM RESET & THEME TOKENS
       ========================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-dark: #070a12;
      --panel-dark: #0d1424;
      --card-inner: #131d33;
      --border-subtle: #1e293b;
      --border-highlight: #334155;

      --amber-500: #f59e0b;
      --amber-600: #d97706;
      --amber-glow: rgba(245, 158, 11, 0.3);

      --sky-400: #38bdf8;
      --emerald-400: #34d399;
      --purple-400: #c084fc;

      --text-white: #ffffff;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-stack);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(217, 119, 6, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(56, 189, 248, 0.06) 0%, transparent 45%);
    }

    /* =========================================================
       2. TOP GLOBAL HEADER
       ========================================================= */
    header {
      width: 100%;
      height: 58px;
      background: rgba(10, 15, 26, 0.9);
      border-bottom: 1px solid var(--border-subtle);
      backdrop-filter: blur(10px);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 50;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }

    .brand-badge {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--amber-500), var(--amber-600));
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      box-shadow: 0 2px 10px var(--amber-glow);
    }

    .brand-text {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .brand-text span {
      color: var(--amber-500);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-left: 5px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-btn {
      background: #0f172a;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 6px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background: #1e293b;
      color: var(--text-white);
    }

    /* =========================================================
       3. WORKSPACE SPLIT (50% LEFT / 50% RIGHT)
       ========================================================= */
    .workspace-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 20px 24px;
      overflow: hidden;
    }

    /* =========================================================
       4. LEFT PANEL: AI / DB STREAMING STORY BOX
       ========================================================= */
    .left-story-panel {
      background: var(--panel-dark);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .stream-meta-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 16px;
    }

    .stream-badge-pill {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
      padding: 3px 10px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .stream-badge-pill::before {
      content: "";
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .latency-indicator {
      font-size: 10.5px;
      color: var(--text-dim);
      font-family: monospace;
    }

    .story-content-body {
      flex: 1;
      overflow-y: auto;
      padding-right: 6px;
    }

    .story-event-title {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.25;
      color: var(--text-white);
      margin-bottom: 6px;
    }

    .story-event-year {
      font-size: 12px;
      font-weight: 700;
      color: var(--amber-500);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 14px;
      display: block;
    }

    /* The typewriter prose element */
    .stream-text-terminal {
      font-size: 13.5px;
      line-height: 1.7;
      color: #cbd5e1;
      white-space: pre-wrap;
      position: relative;
    }

    /* Flashing cursor */
    .terminal-cursor {
      display: inline-block;
      width: 2px;
      height: 15px;
      background: var(--amber-500);
      margin-left: 3px;
      vertical-align: middle;
      animation: blink 0.75s infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* Follow-up / Ask History Context pills */
    .story-footer-interactive {
      margin-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 14px;
    }

    .interactive-label {
      font-size: 10.5px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--sky-400);
      margin-bottom: 8px;
      display: block;
    }

    .context-pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .context-pill {
      background: #090e1a;
      border: 1px solid var(--border-subtle);
      color: #94a3b8;
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .context-pill:hover {
      background: #1e293b;
      color: #f1f5f9;
      border-color: var(--sky-400);
    }

    /* =========================================================
       5. RIGHT PANEL: VERTICAL CHRONOLOGICAL TIMELINE
       ========================================================= */
    .right-timeline-panel {
      background: var(--panel-dark);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .timeline-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 10px;
    }

    .timeline-panel-header h2 {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-white);
    }

    .timeline-panel-header span {
      font-size: 11px;
      color: var(--text-dim);
    }

    /* Scrollable Timeline Track */
    .timeline-track-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 10px 18px 70px 10px;
      position: relative;
    }

    /* Central vertical ruler line */
    .timeline-vertical-ruler {
      position: absolute;
      left: 110px;
      top: 0;
      bottom: 60px;
      width: 2px;
      background: linear-gradient(180deg, var(--amber-500) 0%, #334155 70%, transparent 100%);
    }

    .milestone-item {
      position: relative;
      display: flex;
      align-items: flex-start;
      margin-bottom: 28px;
      cursor: pointer;
    }

    /* Date Anchor on Left */
    .milestone-year-anchor {
      width: 90px;
      text-align: right;
      font-family: monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--amber-500);
      padding-right: 18px;
      padding-top: 3px;
    }

    /* Timeline Node Bullet */
    .milestone-bullet-node {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #0f172a;
      border: 2px solid #64748b;
      position: absolute;
      left: 104px;
      top: 3px;
      z-index: 2;
      transition: all 0.25s ease;
    }

    .milestone-item:hover .milestone-bullet-node {
      background: var(--amber-500);
      border-color: #ffffff;
      transform: scale(1.35);
      box-shadow: 0 0 10px var(--amber-glow);
    }

    .milestone-item.active .milestone-bullet-node {
      background: var(--amber-500);
      border-color: #ffffff;
      box-shadow: 0 0 12px var(--amber-500);
    }

    /* Content Card that smoothly expands on hover */
    .milestone-preview-card {
      margin-left: 36px;
      flex: 1;
      background: var(--card-inner);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 14px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .milestone-item:hover .milestone-preview-card {
      transform: translateX(4px);
      border-color: var(--amber-500);
      background: #1a2642;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    .milestone-item.active .milestone-preview-card {
      border-color: var(--amber-500);
      border-left: 3px solid var(--amber-500);
    }

    .milestone-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-white);
      margin-bottom: 3px;
    }

    .milestone-brief {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Popout line-by-line reveal tray */
    .milestone-drawer-details {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.35s ease, opacity 0.25s ease, margin-top 0.25s ease;
      font-size: 11px;
      color: #93c5fd;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
    }

    .milestone-item:hover .milestone-drawer-details {
      max-height: 80px;
      opacity: 1;
      margin-top: 8px;
      padding-top: 6px;
    }

    .milestone-drawer-details ul {
      padding-left: 14px;
      margin: 0;
    }

    .milestone-drawer-details li {
      margin-bottom: 2px;
    }

    /* =========================================================
       6. CENTERED BOTTOM ROLEPLAY BUTTON (LAUNCH PAD)
       ========================================================= */
    .roleplay-action-dock {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
    }

    .btn-start-roleplay {
      background: linear-gradient(135deg, #d97706, #92400e);
      color: #ffffff;
      border: 1px solid rgba(251, 191, 36, 0.5);
      border-radius: 28px;
      padding: 10px 24px;
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(217, 119, 6, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-start-roleplay:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 6px 24px rgba(245, 158, 11, 0.6);
      background: linear-gradient(135deg, #f59e0b, #b45309);
    }

    .btn-start-roleplay:active {
      transform: translateY(0) scale(0.98);
    }
  </style>
</head>
<body>

  <!-- ================= TOP HEADER ================= -->
  <header>
    <a href="index.html" class="brand-group">
      <div class="brand-badge">इ</div>
      <div class="brand-text">ITIHAS<span>Chronicle Hub</span></div>
    </a>

    <div class="header-actions">
      <a href="universe.html" class="nav-btn">← Universe Arc Hub</a>
      <a href="index.html" class="nav-btn">Home</a>
    </div>
  </header>

  <!-- ================= 50/50 WORKSPACE ================= -->
  <div class="workspace-container">
    
    <!-- LEFT SIDE: AI / DATABASE NARRATIVE TERMINAL -->
    <div class="left-story-panel">
      <div>
        <div class="stream-meta-header">
          <span class="stream-badge-pill">PRE-CACHED STREAM READY</span>
          <span class="latency-indicator">Source: Curated DB + AI Layer</span>
        </div>

        <div class="story-content-body">
          <div class="story-event-year" id="display-event-year">1526 CE</div>
          <h1 class="story-event-title" id="display-event-title">First Battle of Panipat & Foundation</h1>
          
          <!-- Character-by-character typewriter text container -->
          <div class="stream-text-terminal" id="typewriter-stream"></div>
        </div>
      </div>

      <!-- Contextual questions for Ask History -->
      <div class="story-footer-interactive">
        <span class="interactive-label">Contextual Inquiries (Grounded Follow-ups)</span>
        <div class="context-pill-group">
          <button class="context-pill" onclick="promptFollowUp('Tactics')">💬 Why did the cavalry charge fail?</button>
          <button class="context-pill" onclick="promptFollowUp('Artillery')">💬 How was Ottoman gun carriage used?</button>
          <button class="context-pill" onclick="promptFollowUp('Succession')">💬 What happened to Ibrahim Lodi?</button>
        </div>
      </div>
    </div>

    <!-- RIGHT SIDE: VERTICAL TIMELINE -->
    <div class="right-timeline-panel">
      <div class="timeline-panel-header">
        <h2>Mughal Empire Chronicle (1526–1857 CE)</h2>
        <span>Click milestone to stream narrative</span>
      </div>

      <div class="timeline-track-viewport">
        <!-- The visual vertical line -->
        <div class="timeline-vertical-ruler"></div>

        <!-- Milestones injected by JavaScript -->
        <div id="milestones-container"></div>
      </div>

      <!-- CENTERED BOTTOM ROLEPLAY BUTTON -->
      <div class="roleplay-action-dock">
        <button class="btn-start-roleplay" onclick="launchRoleplayModal()">
          ⚡ START HISTORICAL ROLEPLAY
        </button>
      </div>
    </div>

  </div>

  <!-- ================= JAVASCRIPT LOGIC ================= -->
  <script>
    // Historical milestones database
    const TIMELINE_DATA = [
      {
        id: "1526",
        year: "1526 CE",
        title: "First Battle of Panipat",
        brief: "Babur defeats Ibrahim Lodi, ending the Delhi Sultanate and establishing Mughal rule.",
        details: [
          "• Introduction of field artillery & matchlocks",
          "• Deployment of the Tulghuma flanking strategy",
          "• Decisive shift in North Indian warfare"
        ],
        fullStory: "On 21 April 1526, on the arid plain of Panipat, Babur confronted the numerical superiority of Sultan Ibrahim Lodi.\n\nEmploying the Ottoman Rumi tactical formation, Babur tied seven hundred baggage carts together with rawhide ropes to shield his artillery matchlocks. When Lodi's vanguard charged, Babur's elite cavalry flanked both wings in a pincer move known as the Tulghuma.\n\nWithin three hours, the Sultanate lines fractured, marking both the fall of the Lodi dynasty and the establishment of Mughal power in northern India."
      },
      {
        id: "1556",
        year: "1556 CE",
        title: "Second Battle of Panipat",
        brief: "13-year-old Akbar and regent Bairam Khan secure northern India against Hemu.",
        details: [
          "• Secures Agra and Delhi for young Akbar",
          "• Reverses Suri dynasty resurgence",
          "• Marks the start of a 49-year reign of consolidation"
        ],
        fullStory: "Following Humayun's abrupt death, imperial governance fell upon the thirteen-year-old Akbar and his guardian, Bairam Khan.\n\nHemu, the general of the Suri dynasty, had captured Agra and Delhi, assuming the title Vikramaditya. The armies clashed once more at Panipat.\n\nWhile Hemu's massive war elephant phalanx initially pushed the Mughal center backward, an arrow struck Hemu in the eye, throwing his army into immediate disarray. Akbar's forces capitalized on the confusion, securing North India and launching five decades of administrative reform."
      },
      {
        id: "1632",
        year: "1632 CE",
        title: "Taj Mahal Construction & Architecture",
        brief: "Shah Jahan commissions the Taj Mahal, representing the height of Mughal architectural patronage.",
        details: [
          "• Makrana white marble and Pietra Dura stonework",
          "• Symmetrical Charbagh garden layout",
          "• Culmination of Indo-Islamic architectural engineering"
        ],
        fullStory: "Commissioned by Shah Jahan on the banks of the Yamuna at Agra, the Taj Mahal was conceived as a mausoleum for his empress Mumtaz Mahal.\n\nRequiring twenty-two years of labor and master masons from across the subcontinent and Central Asia, the monument combined translucent white marble with semi-precious pietra dura inlays.\n\nThis project marked the peak of imperial building patronages that defined the mid-seventeenth-century classical Mughal aesthetic."
      },
      {
        id: "1658",
        year: "1658 CE",
        title: "Battle of Samugarh & Aurangzeb's Accession",
        brief: "Aurangzeb defeats crown prince Dara Shikoh to claim the Peacock Throne.",
        details: [
          "• Confinement of Shah Jahan at Agra Fort",
          "• Turn toward orthodox governance and southern campaigns",
          "• Sets the stage for prolonged Deccan conflicts"
        ],
        fullStory: "As Shah Jahan fell critically ill in late 1657, imperial Agra dissolved into civil war among four brothers.\n\nWhile the scholarly eldest son Dara Shikoh commanded the imperial guard, Aurangzeb marched seasoned troops north from his Deccan viceroyalty.\n\nAt the scorching battlefield of Samugarh, Aurangzeb's disciplined cavalry routed Dara's army. Shah Jahan was confined to Agra Fort, and Aurangzeb assumed supreme authority, initiating the second, expansionist phase of the empire."
      },
      {
        id: "1707",
        year: "1707 CE",
        title: "Death of Aurangzeb & Fragmentation",
        brief: "Aurangzeb dies after 25 years of grueling Deccan warfare, triggering rapid decentralization.",
        details: [
          "• Overextended imperial military resources",
          "• Resurgence and expansion of the Maratha Confederacy",
          "• Rise of autonomous regional Nawabs (Bengal, Awadh, Hyderabad)"
        ],
        fullStory: "In February 1707, at the age of eighty-eight, Aurangzeb passed away in Ahmednagar after spending twenty-five years leading exhausting desert and hill campaigns against the Marathas.\n\nThe prolonged campaign depleted imperial treasuries and pulled governors away from their provinces.\n\nHis death sparked wars of succession that rapidly eroded central authority, opening the door for the rise of the Maratha Confederacy and the eventual intervention of European trading companies."
      },
      {
        id: "1857",
        year: "1857 CE",
        title: "Siege of Delhi & Dynasty End",
        brief: "The 1857 nationwide uprising marks the formal dissolution of the Mughal dynasty under Bahadur Shah II.",
        details: [
          "• Sepoy regiments proclaim Bahadur Shah Zafar Emperor",
          "• Four-month siege of Delhi by British troops",
          "• Transfer of subcontinental rule directly to the British Crown"
        ],
        fullStory: "When rebellious sepoy regiments marched from Meerut into Delhi in May 1857, they declared the octogenarian poet-king Bahadur Shah Zafar as the symbolic figurehead of Indian resistance against British East India Company rule.\n\nFollowing a four-month siege, British forces breached the Kashmiri Gate. The aged emperor was exiled to Rangoon, bringing three hundred and thirty-one years of Mughal imperial continuity to an official close."
      }
    ];

    let activeEventId = "1526";
    let typewriterTimer = null;

    // Typewriter engine
    function typeTextSmooth(element, text, speed = 12) {
      // Clear any previous typing timer
      if (typewriterTimer) clearInterval(typewriterTimer);

      element.textContent = "";
      let index = 0;

      // Add blinking cursor
      const cursor = document.createElement("span");
      cursor.className = "terminal-cursor";
      element.appendChild(cursor);

      typewriterTimer = setInterval(() => {
        if (index < text.length) {
          // Insert character before the cursor
          cursor.insertAdjacentText("beforebegin", text.charAt(index));
          index++;
        } else {
          clearInterval(typewriterTimer);
          typewriterTimer = null;
        }
      }, speed);
    }

    // Select milestone & trigger animation
    function selectMilestone(id) {
      activeEventId = id;
      const target = TIMELINE_DATA.find(item => item.id === id);
      if (!target) return;

      // Update Header
      document.getElementById("display-event-year").textContent = target.year;
      document.getElementById("display-event-title").textContent = target.title;

      // Stream Narrative
      const streamContainer = document.getElementById("typewriter-stream");
      typeTextSmooth(streamContainer, target.fullStory, 14);

      // Update active highlight classes on milestone list
      const items = document.querySelectorAll(".milestone-item");
      items.forEach(el => {
        el.classList.toggle("active", el.dataset.id === id);
      });
    }

    // Render Timeline on right side
    function renderTimeline() {
      const container = document.getElementById("milestones-container");
      container.innerHTML = "";

      TIMELINE_DATA.forEach(item => {
        const row = document.createElement("div");
        row.className = `milestone-item ${item.id === activeEventId ? "active" : ""}`;
        row.dataset.id = item.id;
        row.onclick = () => selectMilestone(item.id);

        row.innerHTML = `
          <div class="milestone-year-anchor">${item.year}</div>
          <div class="milestone-bullet-node"></div>
          <div class="milestone-preview-card">
            <div class="milestone-name">${item.title}</div>
            <div class="milestone-brief">${item.brief}</div>
            <div class="milestone-drawer-details">
              <ul>
                ${item.details.map(d => `<li>${d}</li>`).join("")}
              </ul>
            </div>
          </div>
        `;

        container.appendChild(row);
      });
    }

    // Launch Roleplay Simulation handler
    function launchRoleplayModal() {
      const current = TIMELINE_DATA.find(item => item.id === activeEventId);
      alert(
        `⚡ LAUNCHING HISTORICAL ROLEPLAY SIMULATION ⚡\n\n` +
        `Target Setting: ${current.year} — ${current.title}\n\n` +
        `Context: You are commanding forces in this critical historical juncture. Choose your strategic directive and evaluate counterfactual outcomes!`
      );
    }

    function promptFollowUp(topic) {
      const streamContainer = document.getElementById("typewriter-stream");
      const followUpText = `\n\n[CURATED AI EXPLANATION — ${topic.toUpperCase()}]:\n` +
        `Examining records regarding ${topic}: Forces adapted their strategies based on terrain constraints, regional logistical supplies, and tactical intelligence from scouts.`;
      
      // Append smoothly
      typeTextSmooth(streamContainer, streamContainer.textContent + followUpText, 10);
    }

    // Initialize on page load
    window.addEventListener("DOMContentLoaded", () => {
      renderTimeline();
      selectMilestone("1526");
    });
  </script>
</body>
</html>
